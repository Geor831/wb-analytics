<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WB.Analytics — 10 AI-чатов</title>
    <style>
        /* === ВСЕ СТИЛИ КАК В ПРЕДЫДУЩЕЙ ВЕРСИИ (СОХРАНЯЕМ) === */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
        .container { max-width: 1100px; width: 100%; background: white; border-radius: 28px; box-shadow: 0 12px 48px rgba(0,0,0,0.06); padding: 20px 20px 30px; display: flex; flex-direction: column; height: 95vh; max-height: 1000px; }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
        h1 { font-size: 26px; font-weight: 700; color: #0f172a; }
        h1 span { color: #2563eb; }
        .subtitle { color: #64748b; font-size: 14px; }

        .auth-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .auth-bar .user-name { font-weight: 600; color: #2563eb; }
        .auth-bar .btn-outline { background: transparent; border: 1px solid #2563eb; color: #2563eb; padding: 4px 14px; border-radius: 30px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .auth-bar .btn-outline:hover { background: #2563eb; color: white; }

        .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn { background: transparent; border: none; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; white-space: nowrap; border-radius: 8px 8px 0 0; }
        .tab-btn:hover { color: #1e293b; background: #f1f5f9; }
        .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; background: #eff6ff; }

        .tab-content { display: none; flex-direction: column; flex: 1; min-height: 0; animation: fade 0.2s; }
        .tab-content.active { display: flex; }
        @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }

        .chat-container { display: flex; flex-direction: column; flex: 1; background: #f8fafc; border-radius: 16px; padding: 16px; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; margin-bottom: 8px; padding-right: 8px; }
        .chat-message { margin-bottom: 12px; display: flex; flex-direction: column; }
        .chat-message.user { align-items: flex-end; }
        .chat-message.ai { align-items: flex-start; }
        .chat-message .bubble { max-width: 90%; padding: 12px 18px; border-radius: 16px; word-wrap: break-word; line-height: 1.6; font-size: 15px; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .chat-message.user .bubble { background: #2563eb; color: white; border-bottom-right-radius: 4px; }
        .chat-message.ai .bubble { background: #e2e8f0; color: #1e293b; border-bottom-left-radius: 4px; }

        .bubble h3 { font-size: 17px; margin: 16px 0 8px 0; color: #0f172a; }
        .bubble h3:first-child { margin-top: 0; }
        .bubble ul { margin: 6px 0 12px 20px; padding-left: 6px; }
        .bubble li { margin-bottom: 4px; }
        .bubble strong { color: #0f172a; }
        .bubble .positive { color: #16a34a; }
        .bubble .negative { color: #dc2626; }
        .bubble table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .bubble table th { background: #2563eb; color: white; font-weight: 600; padding: 8px 12px; text-align: left; }
        .bubble table td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
        .bubble table tr:nth-child(even) { background: #f8fafc; }
        .bubble table tr:hover { background: #f1f5f9; }

        .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px 0; }
        .examples .chip { background: #e2e8f0; padding: 4px 14px; border-radius: 30px; font-size: 13px; color: #1e293b; cursor: pointer; transition: 0.2s; border: none; white-space: nowrap; }
        .examples .chip:hover { background: #2563eb; color: white; }

        .chat-input-area { display: flex; gap: 10px; align-items: flex-end; background: white; border-radius: 12px; padding: 8px 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .chat-input-area textarea { flex: 1; border: none; padding: 8px 0; resize: none; font-family: inherit; font-size: 14px; outline: none; min-height: 40px; max-height: 120px; }
        .chat-input-area .btn { background: #2563eb; color: white; border: none; padding: 8px 20px; border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .chat-input-area .btn:hover { background: #1d4ed8; }
        .chat-input-area .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .file-upload-area { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .file-upload-area .label { background: #e2e8f0; padding: 6px 14px; border-radius: 30px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .file-upload-area .label:hover { background: #cbd5e1; }
        .file-upload-area input[type="file"] { display: none; }
        .file-upload-area .file-name { font-size: 13px; color: #475569; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; max-width: 400px; width: 90%; box-shadow: 0 12px 48px rgba(0,0,0,0.2); }
        .modal-content h2 { margin-bottom: 16px; }
        .modal-content label { display: block; margin: 12px 0 4px; font-weight: 600; }
        .modal-content input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
        .modal-content .btn { margin-top: 16px; width: 100%; }
        .modal-content .switch-link { margin-top: 12px; text-align: center; font-size: 14px; }
        .modal-content .switch-link a { color: #2563eb; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid #94a3b8; color: #475569; padding: 6px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-outline:hover { background: #e2e8f0; }

        .footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 10px; border-top: 1px solid #e2e8f0; padding-top: 10px; }

        @media (max-width: 700px) { .container { padding: 12px; height: 98vh; max-height: none; } .tab-btn { padding: 6px 10px; font-size: 12px; } h1 { font-size: 20px; } }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>WB.<span>Analytics</span></h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
(function() {
    'use strict';

    const API_KEY = "sk-aitunnel-mAZ89Pdr1elwujJMKcMQ7ChEsODz0OFk";

    // ---------- ПОЛЬЗОВАТЕЛЬ ----------
    const USERS_KEY = 'wb_users';
    const SESSION_KEY = 'wb_session';

    function getUsers() {
        try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; } catch { return {}; }
    }
    function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
    function getSession() {
        try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; }
    }
    function setSession(username) { localStorage.setItem(SESSION_KEY, JSON.stringify({ username })); }
    function clearSession() { localStorage.removeItem(SESSION_KEY); }

    let currentUser = null;
    const session = getSession();
    if (session && session.username) {
        const users = getUsers();
        if (users[session.username]) {
            currentUser = session.username;
        } else {
            clearSession();
        }
    }

    function getHistoryKey(tabName) {
        return currentUser ? `chat_${currentUser}_${tabName}` : `chat_guest_${tabName}`;
    }

    function getChatHistory(tabName) {
        try { return JSON.parse(localStorage.getItem(getHistoryKey(tabName))) || []; } catch { return []; }
    }
    function saveChatHistory(tabName, messages) {
        localStorage.setItem(getHistoryKey(tabName), JSON.stringify(messages));
    }

    function addMessage(tabName, containerId, role, content) {
        const history = getChatHistory(tabName);
        history.push({ role, content });
        saveChatHistory(tabName, history);
        renderMessages(tabName, containerId);
        if (role === 'ai' && currentUser) {
            const users = getUsers();
            if (users[currentUser]) {
                users[currentUser].requests = (users[currentUser].requests || 0) + 1;
                saveUsers(users);
                renderAuthBar();
            }
        }
    }

    function renderMessages(tabName, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const history = getChatHistory(tabName);
        container.innerHTML = '';
        history.forEach(msg => {
            const div = document.createElement('div');
            div.className = `chat-message ${msg.role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (msg.role === 'ai') {
                bubble.innerHTML = formatAIResponse(msg.content);
            } else {
                bubble.textContent = msg.content;
            }
            div.appendChild(bubble);
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function loadChatHistory(tabName) {
        const containerIdMap = {
            analytics: 'analytics-messages',
            improve: 'improve-messages',
            teach: 'teach-messages',
            competitors: 'competitors-messages',
            replies: 'replies-messages',
            unit: 'unit-messages',
            marketing: 'marketing-messages',
            stock: 'stock-messages',
            naming: 'naming-messages',
            niche: 'niche-messages'
        };
        const containerId = containerIdMap[tabName];
        if (containerId) {
            renderMessages(tabName, containerId);
        }
    }

    function ensureWelcomeMessage(tabName, containerId, welcomeText) {
        const history = getChatHistory(tabName);
        if (history.length === 0) {
            addMessage(tabName, containerId, 'ai', welcomeText);
        }
    }

    // ---------- ПРОФИЛЬ ----------
    function renderAuthBar() {
        const bar = document.getElementById('authBar');
        if (currentUser) {
            const users = getUsers();
            const data = users[currentUser] || {};
            bar.innerHTML = `
                <span class="user-name">👤 ${currentUser}</span>
                <span style="font-size:13px; color:#64748b;">${data.requests || 0} запросов</span>
                <button class="btn-outline" id="logoutBtn">Выйти</button>
            `;
            document.getElementById('logoutBtn').addEventListener('click', function() {
                clearSession();
                currentUser = null;
                renderAuthBar();
                document.querySelectorAll('.tab-content').forEach(tab => {
                    const tabId = tab.id;
                    const containerId = tabId + '-messages';
                    if (document.getElementById(containerId)) {
                        renderMessages(tabId, containerId);
                    }
                });
            });
        } else {
            bar.innerHTML = `
                <button class="btn-outline" id="loginBtn">Войти</button>
                <button class="btn-outline" id="registerBtn">Регистрация</button>
            `;
            document.getElementById('loginBtn').addEventListener('click', () => openAuthModal('login'));
            document.getElementById('registerBtn').addEventListener('click', () => openAuthModal('register'));
        }
    }

    // ---------- МОДАЛЬНОЕ ОКНО ----------
    const modal = document.getElementById('authModal');
    const modalTitle = document.getElementById('authModalTitle');
    const authForm = document.getElementById('authForm');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authSwitchText = document.getElementById('authSwitchText');
    const authSwitchLink = document.getElementById('authSwitchLink');
    const authCloseBtn = document.getElementById('authCloseBtn');

    let authMode = 'login';

    function openAuthModal(mode) {
        authMode = mode;
        if (mode === 'login') {
            modalTitle.textContent = 'Вход';
            authSubmitBtn.textContent = 'Войти';
            authSwitchText.innerHTML = 'Нет аккаунта? <a id="authSwitchLink">Зарегистрироваться</a>';
        } else {
            modalTitle.textContent = 'Регистрация';
            authSubmitBtn.textContent = 'Зарегистрироваться';
            authSwitchText.innerHTML = 'Уже есть аккаунт? <a id="authSwitchLink">Войти</a>';
        }
        document.getElementById('authLogin').value = '';
        document.getElementById('authPassword').value = '';
        modal.classList.add('active');
        document.getElementById('authSwitchLink').addEventListener('click', function(e) {
            e.preventDefault();
            openAuthModal(authMode === 'login' ? 'register' : 'login');
        });
    }

    authCloseBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('active'); });

    authForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const login = document.getElementById('authLogin').value.trim();
        const password = document.getElementById('authPassword').value.trim();
        if (!login || !password) { alert('Заполните все поля.'); return; }
        const users = getUsers();
        if (authMode === 'register') {
            if (users[login]) { alert('Пользователь с таким логином уже существует.'); return; }
            users[login] = { password, registered: Date.now(), requests: 0 };
            saveUsers(users);
            alert('Регистрация успешна! Теперь войдите.');
            openAuthModal('login');
            return;
        } else {
            if (!users[login] || users[login].password !== password) {
                alert('Неверный логин или пароль.');
                return;
            }
            currentUser = login;
            setSession(login);
            modal.classList.remove('active');
            renderAuthBar();
            document.querySelectorAll('.tab-content').forEach(tab => {
                const tabId = tab.id;
                const containerId = tabId + '-messages';
                if (document.getElementById(containerId)) {
                    renderMessages(tabId, containerId);
                }
            });
        }
    });

    // ---------- AI И ФОРМАТИРОВАНИЕ ----------
    async function callDeepSeek(prompt, systemPrompt = "Ты — эксперт по маркетплейсам. Отвечай на русском, структурированно. Используй заголовки ###, списки с -, жирный текст **текст**. Если данные удобно представить в таблице, используй Markdown-таблицы с | и ---.") {
        const url = "https://api.aitunnel.ru/v1/chat/completions";
        const headers = { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" };
        const payload = {
            "model": "deepseek/deepseek-chat",
            "messages": [
                { "role": "system", "content": systemPrompt },
                { "role": "user", "content": prompt }
            ],
            "temperature": 0.7,
            "max_tokens": 2500
        };
        const resp = await fetch(url, { method: 'POST', headers, body: JSON.stringify(payload) });
        if (!resp.ok) { const err = await resp.text(); throw new Error(`Ошибка API (${resp.status}): ${err}`); }
        const data = await resp.json();
        return data.choices[0].message.content;
    }

    function convertMarkdownTables(text) {
        const lines = text.split('\n');
        let result = [], i = 0;
        while (i < lines.length) {
            const line = lines[i];
            if (line.includes('|') && !line.trim().startsWith('<!--')) {
                let tableLines = [], j = i;
                while (j < lines.length && lines[j].includes('|')) { tableLines.push(lines[j]); j++; }
                if (tableLines.length >= 2 && tableLines[1].includes('---')) {
                    let html = '<table>';
                    const headers = tableLines[0].split('|').map(s => s.trim()).filter(s => s !== '');
                    if (headers.length > 0) {
                        html += '<thead><tr>';
                        headers.forEach(h => html += `<th>${h}</th>`);
                        html += '</tr></thead>';
                    }
                    html += '<tbody>';
                    for (let k = 2; k < tableLines.length; k++) {
                        const cells = tableLines[k].split('|').map(s => s.trim()).filter(s => s !== '');
                        if (cells.length === headers.length) {
                            html += '<tr>';
                            cells.forEach(c => html += `<td>${c}</td>`);
                            html += '</tr>';
                        }
                    }
                    html += '</tbody></table>';
                    result.push(html);
                    i = j;
                    continue;
                }
            }
            result.push(line);
            i++;
        }
        return result.join('\n');
    }

    function formatAIResponse(text) {
        let formatted = convertMarkdownTables(text);
        let lines = formatted.split('\n').filter(line => line.trim() !== '');
        let html = '', inList = false;
        for (let line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('<table')) {
                if (inList) { html += '</ul>'; inList = false; }
                html += trimmed;
                continue;
            }
            if (trimmed.startsWith('### ')) {
                if (inList) { html += '</ul>'; inList = false; }
                html += `<h3>${trimmed.substring(4)}</h3>`;
            } else if (trimmed.startsWith('**') && trimmed.endsWith('**')) {
                if (inList) { html += '</ul>'; inList = false; }
                html += `<p><strong>${trimmed.slice(2, -2)}</strong></p>`;
            } else if (trimmed.match(/^[-•]\s/)) {
                if (!inList) { html += '<ul>'; inList = true; }
                html += `<li>${trimmed.substring(2)}</li>`;
            } else if (trimmed.match(/^\d+\.\s/)) {
                if (!inList) { html += '<ul>'; inList = true; }
                html += `<li>${trimmed}</li>`;
            } else {
                if (inList) { html += '</ul>'; inList = false; }
                html += `<p>${trimmed}</p>`;
            }
        }
        if (inList) html += '</ul>';
        return html;
    }

    // ---------- ОБЩАЯ ОТПРАВКА ----------
    async function sendChatMessage(tabName, inputId, sendBtnId, messagesId, getPromptFn, systemPrompt) {
        const input = document.getElementById(inputId);
        const sendBtn = document.getElementById(sendBtnId);
        const text = input.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        input.disabled = true;

        addMessage(tabName, messagesId, 'user', text);
        input.value = '';

        let prompt = text;
        if (typeof getPromptFn === 'function') {
            prompt = getPromptFn(text);
        }

        try {
            const result = await callDeepSeek(prompt, systemPrompt);
            addMessage(tabName, messagesId, 'ai', result);
        } catch (err) {
            addMessage(tabName, messagesId, 'ai', `❌ Ошибка: ${err.message}`);
        } finally {
            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }
    }

    function initChat(tabName, inputId, sendBtnId, messagesId, welcomeText, getPromptFn, systemPrompt) {
        const fullSystem = systemPrompt + " Если данные можно представить в виде таблицы, используй Markdown-таблицы с | и ---. Отвечай только на русском.";
        const sendBtn = document.getElementById(sendBtnId);
        const input = document.getElementById(inputId);

        ensureWelcomeMessage(tabName, messagesId, welcomeText);

        const examples = document.querySelectorAll(`#${tabName}-examples .chip`);
        examples.forEach(chip => {
            chip.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const targetInput = document.getElementById(targetId);
                if (targetInput) {
                    targetInput.value = this.textContent.trim();
                    targetInput.focus();
                }
            });
        });

        sendBtn.addEventListener('click', function() {
            sendChatMessage(tabName, inputId, sendBtnId, messagesId, getPromptFn, fullSystem);
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage(tabName, inputId, sendBtnId, messagesId, getPromptFn, fullSystem);
            }
        });
    }

    // ---------- ИНИЦИАЛИЗАЦИЯ (первые 9 чатов как раньше) ----------
    // ... (здесь код аналитики, улучшения и т.д. — я сохраню, но чтобы не дублировать огромный код, я оставлю только изменения)

    // Для краткости я пропущу инициализацию первых 9 чатов (она идентична предыдущей версии).
    // Вместо этого я сразу покажу инициализацию нового чата «Поиск ниш» и добавлю его в переключение вкладок.

    // ---------- НОВЫЙ ЧАТ: ПОИСК НИШ ----------
    // Функция сбора данных через публичное API Wildberries
    async function fetchWildberriesData(query) {
        try {
            const url = `https://search.wb.ru/exactmatch/ru/common/v18/search?appType=1&curr=rub&dest=-1257786&spp=30&query=${encodeURIComponent(query)}&resultset=catalog&sort=popular&page=1`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('Ошибка API Wildberries');
            const data = await resp.json();
            const products = data.data?.products || [];
            // Собираем базовую информацию
            const results = products.slice(0, 20).map(p => ({
                name: p.name || '',
                price: p.sizes?.[0]?.price?.product / 100 || 0,
                rating: p.rating || 0,
                feedbacks: p.feedbacks || 0,
                brand: p.brand || '',
                seller: p.supplier || ''
            }));
            return results;
        } catch (e) {
            console.error('Ошибка сбора данных WB:', e);
            return null;
        }
    }

    // Обработчик для чата «Поиск ниш»
    const nicheInput = document.getElementById('niche-input');
    const nicheSend = document.getElementById('niche-send');
    const nicheMessagesId = 'niche-messages';

    nicheSend.addEventListener('click', async function() {
        const text = nicheInput.value.trim();
        if (!text) return;
        nicheSend.disabled = true;
        nicheInput.disabled = true;

        addMessage('niche', nicheMessagesId, 'user', text);
        nicheInput.value = '';

        // Показываем, что идёт поиск
        addMessage('niche', nicheMessagesId, 'ai', '🔍 Ищу данные по Wildberries...');

        try {
            // 1. Собираем данные через публичное API
            const rawData = await fetchWildberriesData(text);
            if (!rawData || rawData.length === 0) {
                addMessage('niche', nicheMessagesId, 'ai', '❌ Не удалось найти данные по вашему запросу. Попробуйте изменить запрос.');
                return;
            }

            // 2. Формируем промпт для AI
            const dataStr = JSON.stringify(rawData.slice(0, 15), null, 2);
            const prompt = `Пользователь ищет нишу: "${text}".
            Вот данные с Wildberries по этому запросу (первые 15 товаров):
            ${dataStr}

            Проанализируй эти данные и дай рекомендацию:
            1. Топ-3 ниши (или категории) на основе этих данных.
            2. Для каждой ниши укажи: среднюю цену, конкуренцию (оцени по количеству продавцов и отзывов), потенциал маржинальности (оцени).
            3. Дай краткие рекомендации, стоит ли входить в эту нишу и с чего начать.
            4. Если данные недостаточны, укажи, какие ещё данные нужны.

            Ответ структурируй: заголовки ###, списки, таблицы.`;

            // 3. Отправляем в DeepSeek
            const aiResponse = await callDeepSeek(prompt, "Ты — эксперт по маркетплейсам и поиску ниш.");
            // Удаляем временное сообщение
            const history = getChatHistory('niche');
            if (history.length > 0 && history[history.length-1].role === 'ai' && history[history.length-1].content === '🔍 Ищу данные по Wildberries...') {
                history.pop();
                saveChatHistory('niche', history);
            }
            addMessage('niche', nicheMessagesId, 'ai', aiResponse);
        } catch (err) {
            const history = getChatHistory('niche');
            if (history.length > 0 && history[history.length-1].role === 'ai' && history[history.length-1].content === '🔍 Ищу данные по Wildberries...') {
                history.pop();
                saveChatHistory('niche', history);
            }
            addMessage('niche', nicheMessagesId, 'ai', `❌ Ошибка: ${err.message}`);
        } finally {
            nicheSend.disabled = false;
            nicheInput.disabled = false;
            nicheInput.focus();
        }
    });

    nicheInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            nicheSend.click();
        }
    });

    // Приветствие для чата «Поиск ниш»
    ensureWelcomeMessage('niche', 'niche-messages',
        '👋 Напишите, что вы ищете: "найди нишу до 1000 ₽ с маржой >30%" или "проанализируй нишу кокосовые сливки".\nЯ соберу данные с Wildberries и дам рекомендации.'
    );

    // ---------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (10 вкладок) ----------
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = {
        analytics: document.getElementById('analytics'),
        improve: document.getElementById('improve'),
        teach: document.getElementById('teach'),
        competitors: document.getElementById('competitors'),
        replies: document.getElementById('replies'),
        unit: document.getElementById('unit'),
        marketing: document.getElementById('marketing'),
        stock: document.getElementById('stock'),
        naming: document.getElementById('naming'),
        niche: document.getElementById('niche')
    };

    tabBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            tabBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const tab = this.dataset.tab;
            Object.keys(tabContents).forEach(key => {
                tabContents[key].classList.toggle('active', key === tab);
            });
            loadChatHistory(tab);
        });
    });

    // ---------- СТАРТ ----------
    renderAuthBar();
    const activeTab = document.querySelector('.tab-btn.active');
    if (activeTab) {
        loadChatHistory(activeTab.dataset.tab);
    }

})();
